<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Laut 🌊</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bubbles"></canvas>
  <header>
    <nav>
      <div class="logo">🌊 Portofolio</div>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">Tentang</a></li>
        <li><a href="#projects">Proyek</a></li>
        <li><a href="#experience">Pengalaman</a></li>
        <li><a href="#contact">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <section id="home" class="hero">
    <div class="hero-content">
      <h1 id="hero-name">Nama Kamu</h1>
      <p id="hero-title">Web Developer & Designer</p>
      <a href="#projects" class="btn">Lihat Karya</a>
    </div>
    <div class="wave"></div>
  </section>

  <section id="about" class="section">
    <h2>Tentang Saya</h2>
    <div class="about-content">
      <img id="avatar" src="" alt="Avatar">
      <p id="bio"></p>
    </div>
  </section>

  <section id="projects" class="section">
    <h2>Proyek Unggulan</h2>
    <div id="projects-container" class="projects-grid"></div>
  </section>

  <section id="experience" class="section">
    <h2>Pengalaman & Pendidikan</h2>
    <div class="exp-edu">
      <div id="experience-list"></div>
      <div id="education-list"></div>
    </div>
  </section>

  <section id="skills" class="section">
    <h2>Keahlian</h2>
    <div id="skills-container" class="skills"></div>
  </section>

  <section id="contact" class="section">
    <h2>Kontak</h2>
    <div id="contact-info"></div>
  </section>

  <footer>
    <p>© 2025 <span id="footer-name">Nama Kamu</span>. Dibuat dengan 🌊</p>
  </footer>

  <script src="assets/js/portfolio.js"></script>
</body>
</html>
